# Model Configuration for Benchmark Generation Pipeline
# This file centralizes all model settings for agents and tools

# Unified gateway credentials are read from the environment at runtime.
api:
  api_key_env: "YOUR_LLM_API_KEY_ENV"
  base_url: "https://your-llm-gateway.example/v1"

# Agent Models (used by Agent instances for decision-making)
agents:
  design: "gpt-6.1-sol"        # Design Agent
  grounding: "gpt-6.1-sol"     # Grounding Agent
  allocation: "gpt-6.1-sol"     # Allocation Agent

# Tool Models (used by individual tools for specific tasks)
tools:
  # Initialization & Parsing
  parse_subtasks: "gpt-6.1-sol"   # Parse topic to subtasks
  
  # Analyst Tools
  analyst_model: "gpt-6.1-sol"    # Used by llm_revise_one_subtask, llm_replan_subtasks
  
  # Scoring & Evaluation
  transformability_check: "gpt-6.1-sol"  # Check dataset transformability
  scoring: "gpt-6.1-sol"          # Score dataset candidates
  
  # Planning
  importance_and_quota: "gpt-6.1-sol"  # Calculate importance and quota
  diagnose_allocation: "gpt-6.1-sol"      # Diagnose allocation failures (uses DEFAULT_MODEL)
  
  # Generation & Transformation
  transform_stage1: "gpt-6.1-sol"  # Stage 1: Sample-level planning
  transform_stage2: "gpt-6.1-sol"  # Stage 2: Execute transformation
  
  # Verification
  verify: "gpt-6.1-sol"            # Verify transformed samples
  
  # Default model for tools that don't specify (used by llm_caller)
  default: "gpt-6.1-sol"
